<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexorious — Setup</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#6d28d9">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .brand-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
    .brand-row img { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="admin-view">
      <div class="brand-row">
        <img src="/logo.svg" alt="">
        <h1 class="card-title">Welcome to Nexorious</h1>
      </div>
      <p class="card-description">Create your admin account to get started.</p>
      <div class="alert-destructive" id="admin-err"></div>
      <form id="admin-form" class="stack">
        <div>
          <label class="label" for="username">Username</label>
          <input class="input" type="text" id="username" name="username" autocomplete="username" required minlength="3">
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        </div>
        <div>
          <label class="label" for="confirm">Confirm Password</label>
          <input class="input" type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" id="admin-btn">Create Admin Account</button>
      </form>
      <div class="footer-row">
        <button type="button" class="btn-link" onclick="showRestore()">Restore from backup instead</button>
      </div>
    </div>

    <div id="restore-view" style="display:none">
      <div class="brand-row">
        <img src="/logo.svg" alt="">
        <h1 class="card-title">Restore from Backup</h1>
      </div>
      <p class="card-description">Upload a backup file, or pick one already on disk.</p>
      <div class="alert-destructive" id="restore-err"></div>
      <p class="card-description" id="restore-status" style="display:none"></p>

      <input type="file" id="file-input" accept=".tar.gz" style="display:none">
      <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="drop-zone-icon">📦</div>
        <strong>Click to select a backup file</strong>
        <span>.tar.gz files only</span>
      </div>
      <div id="file-info" class="file-info" style="display:none">
        <div class="file-info-text">
          <span class="file-info-name" id="file-name"></span>
          <span class="file-info-size" id="file-size"></span>
        </div>
        <button type="button" class="clear-btn" onclick="clearFile()" title="Remove">✕</button>
      </div>
      <button type="button" class="btn btn-primary" id="restore-btn" onclick="doRestore()" disabled>Restore</button>

      <div id="ondisk-section">
        <p id="ondisk-or" class="card-description" style="display:none; margin:16px 0 8px 0"><strong>Or restore from a backup found on disk</strong></p>
        <ul id="ondisk-list" class="ondisk-list" style="display:none; list-style:none; padding:0; margin:0"></ul>
      </div>

      <div class="footer-row">
        <button type="button" class="btn-link" onclick="showAdmin()">Cancel — create a new account instead</button>
      </div>
    </div>
  </div>

  <script>
    function showRestore() {
      document.getElementById('admin-view').style.display = 'none';
      document.getElementById('restore-view').style.display = '';
      clearError('restore-err');
      loadOnDiskBackups();
    }

    // Format a UTC ISO date as a local "YYYY-MM-DD HH:MM" string.
    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function fmtCount(n) {
      return new Intl.NumberFormat().format(n);
    }

    let _ondiskLoaded = false;
    async function loadOnDiskBackups() {
      if (_ondiskLoaded) return;
      _ondiskLoaded = true;
      const list = document.getElementById('ondisk-list');
      const orLine = document.getElementById('ondisk-or');

      let backups = [];
      try {
        const res = await fetch('/api/auth/setup/backups');
        if (res.ok) {
          const data = await res.json();
          backups = Array.isArray(data.backups) ? data.backups : [];
        }
      } catch {
        // Fetch failure — leave the section hidden; upload zone above is sufficient.
      }

      if (backups.length === 0) {
        // No on-disk backups (or fetch failed). Section stays hidden so the
        // user just sees the upload zone, which is the only path that works.
        return;
      }

      backups.forEach(b => {
        const li = document.createElement('li');
        li.style.cssText = 'border:1px solid var(--border, #444); border-radius:6px; padding:10px 12px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px';

        // Filename gets the full card width; even ~42-char timestamped names
        // fit in a slightly smaller monospace face on a single line.
        const name = document.createElement('div');
        name.textContent = b.filename;
        name.style.cssText = 'font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.875em; font-weight:600; overflow-wrap:anywhere';
        li.appendChild(name);

        const meta = document.createElement('div');
        meta.style.cssText = 'font-size:0.85em; opacity:0.75';
        const parts = [];
        if (b.manifest && b.manifest.created_at) parts.push(fmtDate(b.manifest.created_at));
        else parts.push(fmtDate(b.mtime));
        parts.push(formatBytes(b.size_bytes));
        if (b.manifest && b.manifest.backup_type) parts.push(b.manifest.backup_type);
        meta.textContent = parts.join(' · ');
        li.appendChild(meta);

        if (b.manifest && b.manifest.stats) {
          const stats = document.createElement('div');
          stats.style.cssText = 'font-size:0.85em; opacity:0.75';
          const s = b.manifest.stats;
          const v = b.manifest.app_version ? ' · v' + b.manifest.app_version : '';
          stats.textContent = fmtCount(s.games) + ' games · ' + fmtCount(s.users) + ' users · ' + fmtCount(s.tags) + ' tags' + v;
          li.appendChild(stats);
        }

        if (!b.restorable && b.reason) {
          const reason = document.createElement('div');
          reason.style.cssText = 'font-size:0.85em; color:var(--destructive, #f87171)';
          reason.textContent = '⚠ ' + b.reason;
          li.appendChild(reason);
        }

        // Button row, right-aligned. Override .btn-primary's width:100% so the
        // button hugs its label.
        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex; justify-content:flex-end; margin-top:2px';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-primary';
        btn.textContent = 'Restore';
        btn.style.cssText = 'width:auto; flex:0 0 auto; padding:0.4rem 1.1rem';
        btn.disabled = !b.restorable;
        btn.onclick = () => restoreFromDisk(b.filename);
        actions.appendChild(btn);
        li.appendChild(actions);

        list.appendChild(li);
      });

      list.style.display = '';
      orLine.style.display = '';
    }

    async function restoreFromDisk(filename) {
      if (!confirm('Restore from ' + filename + '? This will replace any existing data.')) return;
      clearError('restore-err');
      // Capture buttons that were enabled before this attempt so the failure
      // path restores them without also enabling buttons originally disabled
      // for non-restorable items.
      const previouslyEnabled = Array.from(
        document.querySelectorAll('#ondisk-list button, #restore-btn')
      ).filter(b => !b.disabled);
      previouslyEnabled.forEach(b => { b.disabled = true; });
      const reenable = () => previouslyEnabled.forEach(b => { b.disabled = false; });
      await runRestore(() => fetch('/api/auth/setup/restore/disk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename }),
      }), reenable);
    }
    function showAdmin() {
      document.getElementById('restore-view').style.display = 'none';
      document.getElementById('admin-view').style.display = '';
      clearError('admin-err');
    }
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
    }
    function clearError(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.remove('visible');
    }

    // File selection
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.endsWith('.tar.gz')) {
        showError('restore-err', 'Please select a .tar.gz backup file.');
        e.target.value = '';
        return;
      }
      clearError('restore-err');
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('file-size').textContent = formatBytes(file.size);
      document.getElementById('file-info').style.display = 'flex';
      document.getElementById('restore-btn').disabled = false;
    });

    function clearFile() {
      document.getElementById('file-input').value = '';
      document.getElementById('file-info').style.display = 'none';
      document.getElementById('drop-zone').style.display = '';
      document.getElementById('restore-btn').disabled = true;
      clearError('restore-err');
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // Create admin
    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError('admin-err');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (username.length < 3) return showError('admin-err', 'Username must be at least 3 characters.');
      if (password.length < 8) return showError('admin-err', 'Password must be at least 8 characters.');
      if (password !== confirm) return showError('admin-err', 'Passwords do not match.');

      const btn = document.getElementById('admin-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/setup/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.status === 201) {
          window.location.href = '/';
        } else if (res.status === 400) {
          const body = await res.json();
          showError('admin-err', body.error || 'Validation error.');
        } else if (res.status === 403 || res.status === 500) {
          window.location.href = '/login';
        } else {
          showError('admin-err', 'Setup failed. Please try again.');
        }
      } catch {
        showError('admin-err', 'Setup failed. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Admin Account';
      }
    });

    // Restore from backup
    async function doRestore() {
      const file = document.getElementById('file-input').files[0];
      if (!file) return;
      clearError('restore-err');

      const btn = document.getElementById('restore-btn');
      btn.disabled = true;
      btn.textContent = 'Restoring…';

      const form = new FormData();
      form.append('file', file);
      await runRestore(() => fetch('/api/auth/setup/restore', { method: 'POST', body: form }), () => {
        btn.disabled = false;
        btn.textContent = 'Restore';
      });
    }

    // A restore that has started ends with the server restarting (#1341), on
    // success and on failure. Wait until /health answers with a new instance
    // id, then go on: to the login page after a success, back to this page
    // (which the restarted server serves again) after a failure.
    const RESTORE_ERROR_KEY = 'nexorious.setupRestoreError';

    async function readHealth() {
      try {
        const res = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
        return res.ok ? await res.json() : null;
      } catch {
        return null;
      }
    }

    // The grace period starts again each time the old server reports a
    // restore still in progress: a restore can outlast a proxy's timeout.
    async function waitForNewInstance(oldId) {
      const graceMs = 120000;
      let deadline = Date.now() + graceMs;
      for (;;) {
        const h = await readHealth();
        if (h) {
          if (oldId && h.instance_id && h.instance_id !== oldId) return true;
          if (!oldId && !h.restore_in_progress) return true;
          if (h.restore_in_progress) deadline = Date.now() + graceMs;
        }
        if (Date.now() > deadline) return false;
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    function showStatus(msg) {
      const el = document.getElementById('restore-status');
      el.textContent = msg;
      el.style.display = msg ? '' : 'none';
    }

    async function runRestore(send, reenable) {
      const before = await readHealth();
      let res = null;
      let body = null;
      try {
        res = await send();
        body = await res.json().catch(() => null);
      } catch {
        // No answer: the restore may still have started.
      }
      // A body from the restore handler says whether the server restarts;
      // without one, a 5xx or no answer at all may have started a restore.
      const restarting = body && typeof body.restarting === 'boolean'
        ? body.restarting
        : (!res || res.status >= 500);
      if (!restarting) {
        if (res && res.ok) {
          window.location.href = '/login';
          return;
        }
        showError('restore-err', (body && body.error) || 'Restore failed. Please try again.');
        reenable();
        return;
      }

      showStatus('The server is restarting. This page moves on when it is back…');
      const oldId = (body && body.instance_id) || (before && before.instance_id);
      const back = await waitForNewInstance(oldId);
      showStatus('');
      if (!back) {
        showError('restore-err', 'The server did not come back after the restore. Check the server logs, then reload this page.');
        return;
      }
      if (res && res.ok) {
        window.location.href = '/login';
        return;
      }
      try {
        sessionStorage.setItem(RESTORE_ERROR_KEY, (body && body.error) ||
          'The restore request got no answer, so its outcome is unknown. Check the server logs.');
      } catch {
        // Storage unavailable: the error is not shown after the reload.
      }
      window.location.reload();
    }

    // The error of a restore that failed before the server restarted.
    (function showRestoreErrorAfterRestart() {
      let msg = null;
      try {
        msg = sessionStorage.getItem(RESTORE_ERROR_KEY);
        sessionStorage.removeItem(RESTORE_ERROR_KEY);
      } catch {
        return;
      }
      if (msg) {
        showRestore();
        showError('restore-err', msg);
      }
    })();
  </script>
</body>
</html>
