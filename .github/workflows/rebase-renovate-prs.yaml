---
name: Rebase Renovate PRs

on:
  push:
    branches: [main]
    paths:
      - 'go.sum'
      - 'ui/frontend/package-lock.json'
  workflow_dispatch:

jobs:
  rebase:
    name: Rebase open renovate PRs onto main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # Full history is required so git can compute merge bases when merging
          # PR branches that diverged from an older main commit.
          fetch-depth: 0
          # Push with the PAT so downstream workflows are triggered (GITHUB_TOKEN
          # pushes do not trigger workflow runs). checkout stores it as a masked
          # extraheader, never in the remote URL.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase open renovate PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Find open PRs whose branch names start with renovate/.
          pr_json=$(gh pr list --state open --json number,headRefName --limit 100)
          mapfile -t pr_entries < <(
            jq -r '.[] | select(.headRefName | startswith("renovate/")) | "\(.number) \(.headRefName)"' \
              <<< "$pr_json"
          )

          if [ "${#pr_entries[@]}" -eq 0 ]; then
            echo "No open renovate PRs found."
            exit 0
          fi

          for entry in "${pr_entries[@]}"; do
            pr_number="${entry%% *}"
            branch="${entry#* }"
            echo "--- PR #${pr_number}: ${branch} ---"

            # Fetch the tip of the PR branch into a remote tracking ref so
            # subsequent git commands can resolve origin/${branch}.
            if ! git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              echo "  Could not fetch ${branch}; skipping."
              continue
            fi

            # Skip if the branch already contains the latest main commit.
            if git merge-base --is-ancestor origin/main "origin/${branch}"; then
              echo "  Already up to date; skipping."
              continue
            fi

            # Check out a local copy of the PR branch.
            git checkout -B "${branch}" "origin/${branch}"

            # Merge main. A conflict on the npmDepsHash / goVendorHash line
            # (both this PR and main changed it) is expected: redo the merge
            # with -X theirs to take main's line, and nix.yaml re-patches the
            # correct hash right after the push. -X theirs only touches
            # conflicting hunks, so it is safe once we know the hash files are
            # the only conflicts. Any other conflict (package-lock.json,
            # go.sum, ...) must not be resolved textually — that yields a
            # lockfile out of sync with package.json / go.mod (#1242). Skip
            # the PR instead; Renovate rebases conflicted branches on its next
            # run and regenerates the lockfile properly.
            if ! git merge origin/main --no-edit \
                -m "chore: merge main into ${branch}"; then
              mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
              git merge --abort
              non_hash=()
              for f in "${conflicted[@]}"; do
                case "$f" in
                  flake.nix|nix/frontend.nix) ;;
                  *) non_hash+=("$f") ;;
                esac
              done
              if [ "${#conflicted[@]}" -eq 0 ] || [ "${#non_hash[@]}" -gt 0 ]; then
                echo "  Conflict outside the Nix hash files for PR #${pr_number} (${non_hash[*]:-unknown}); skipping — Renovate will rebase it."
                git checkout -f main
                continue
              fi
              echo "  Only Nix hash files conflict (${conflicted[*]}); merging with -X theirs."
              if ! git merge origin/main -X theirs --no-edit \
                  -m "chore: merge main into ${branch}"; then
                echo "  Merge with -X theirs failed for PR #${pr_number}; skipping."
                git merge --abort 2>/dev/null || true
                git checkout -f main
                continue
              fi
            fi

            # Update flake inputs so the PR picks up the latest nixpkgs
            # (and therefore the latest Go toolchain / other packages).
            nix flake update
            git add flake.lock
            git diff --cached --quiet || \
              git commit -m "chore(nix): update flake inputs for ${branch}"

            # Push via PAT. PRs that touch .github/workflows/ require the PAT
            # to have the `workflow` scope — skip them gracefully if the push
            # is rejected for that reason.
            if ! git push origin "refs/heads/${branch}:refs/heads/${branch}"; then
              echo "  Push failed for PR #${pr_number} (branch may touch workflow files requiring 'workflow' PAT scope); skipping."
              git checkout -f main
              continue
            fi
            echo "  Pushed updated branch for PR #${pr_number}."

            # Return to main before processing the next PR.
            git checkout -f main
          done
