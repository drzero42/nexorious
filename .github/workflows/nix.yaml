---
name: Nix Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.sum'
      - 'ui/frontend/package-lock.json'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches: [main]
    paths:
      - 'go.sum'
      - 'ui/frontend/package-lock.json'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Verify only: nothing here pushes to the PR branch. Renovate updates
      # goVendorHash itself (postUpgradeTasks → nix/update-go-vendor-hash.sh);
      # for a hand-made go.mod/go.sum change, run that script and commit.
      - name: Build packages
        run: |
          set +e
          # Build both the server and the client. They share one vendorHash
          # (flake.nix → goVendorHash), so building both here guards the client
          # too — nothing else in CI/release builds .#nexctl via Nix.
          nix build .#nexorious .#nexctl 2>&1 | tee /tmp/nix-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ] && grep -q "hash mismatch" /tmp/nix-build.log; then
            echo "::error file=flake.nix::goVendorHash is stale. Run ./nix/update-go-vendor-hash.sh and commit flake.nix."
          fi
          exit "$BUILD_EXIT"
