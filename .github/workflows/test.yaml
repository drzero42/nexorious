---
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR supersedes the run for the previous commit; runs on main
# always finish so every squash commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which areas a pull request touches so the heavy suites below only
  # run when relevant. On push-to-main we validate everything. The `CI Gate`
  # job aggregates the results and is the single required status check —
  # individual suites report "skipped" for untouched areas, which the gate
  # treats as a pass.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the PR base commit is present for the diff below.
          fetch-depth: 0

      - name: Determine changed areas
        id: filter
        run: |
          set -euo pipefail
          go=false
          frontend=false
          helm=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push to main — validate all.
            go=true
            frontend=true
            helm=true
          else
            BASE='${{ github.event.pull_request.base.sha }}'
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
            echo "Changed files:"
            echo "$CHANGED"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # CI / build infra changes re-validate everything.
                .github/*) go=true; frontend=true; helm=true ;;
                *.go|go.mod|go.sum|.golangci.yml|internal/db/migrations/*) go=true ;;
                ui/frontend/*) frontend=true ;;
                deploy/helm/*) helm=true ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "Resolved areas: go=$go frontend=$frontend helm=$helm"
          {
            echo "go=$go"
            echo "frontend=$frontend"
            echo "helm=$helm"
          } >> "$GITHUB_OUTPUT"

  # PR-only: on push to main, race.yaml runs the same suite under -race (and
  # opens an issue on failure), so running the plain suite too is redundant.
  go-tests:
    name: Go Tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go and Postgres test dependencies
        uses: ./.github/actions/go-pg-setup

      - name: Run Go tests
        env:
          # Tests use testcontainers to spin up their own PostgreSQL container.
          # Point testcontainers at the Docker daemon available on GitHub-hosted runners.
          DOCKER_HOST: unix:///var/run/docker.sock
        run: go test -timeout 600s ./...

  go-lint:
    name: Go Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  frontend-tests:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: cd ui/frontend && npm ci

      - name: Run frontend tests
        run: cd ui/frontend && npm run test

  frontend-checks:
    name: Frontend Checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: cd ui/frontend && npm ci

      - name: Type check and lint
        run: cd ui/frontend && npm run check

      - name: Knip (dead code)
        run: cd ui/frontend && npm run knip

      # routeTree.gen.ts is generated by the TanStack Router Vite plugin and
      # committed (tsc/knip above read it without a build). Regenerate it and
      # fail if the committed copy differs, whether from a route change or a
      # router-plugin bump that changed the generator's output.
      - name: Route tree is up to date
        run: |
          cd ui/frontend
          npx vite build
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "::error file=ui/frontend/src/routeTree.gen.ts::routeTree.gen.ts is stale. Run 'npm run build' in ui/frontend and commit the regenerated file."
            exit 1
          fi

  helm-lint:
    name: Helm Lint
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Cache Helm chart dependencies
        uses: actions/cache@v6
        with:
          path: |
            deploy/helm/charts
            ~/.cache/helm
          key: helm-deps-${{ hashFiles('deploy/helm/Chart.lock') }}

      - name: Add bjw-s Helm repo
        run: helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/

      - name: Build Helm dependencies
        run: helm dependency build deploy/helm/

      - name: Lint Helm chart
        run: |
          # Lint twice to exercise both VictoriaLogs delivery modes (the default
          # vmrule, and the no-operator configmap variant).
          for vl_delivery in vmrule configmap; do
            helm lint --strict deploy/helm/ \
              --set nexorious.dbEncryptionKey=x \
              --set nexorious.postgresql.password=x \
              --set nexorious.igdbClientId=x \
              --set nexorious.igdbClientSecret=x \
              --set alerts.enabled=true \
              --set alerts.loki.enabled=true \
              --set alerts.victoriaLogs.enabled=true \
              --set alerts.victoriaLogs.delivery=$vl_delivery \
              --set alerts.prometheus.enabled=true \
              --set alerts.victoriaMetrics.enabled=true \
              --set serviceMonitor.main.enabled=true \
              --set dashboard.enabled=true
          done

      - name: Lint and render Helm chart with CloudNativePG
        run: |
          cnpg_values=(
            --set nexorious.dbEncryptionKey=x
            --set nexorious.igdbClientId=x
            --set nexorious.igdbClientSecret=x
            --set cnpg.enabled=true
            --set controllers.postgresql.enabled=false
            --set service.postgresql.enabled=false
            --set persistence.postgresql-data.enabled=false
          )
          helm lint --strict deploy/helm/ "${cnpg_values[@]}"
          helm template nexorious deploy/helm/ "${cnpg_values[@]}" > /tmp/cnpg.yaml
          # The Cluster is rendered and the app reads the operator's app Secret.
          grep -q '^kind: Cluster$' /tmp/cnpg.yaml
          grep -q 'name: nexorious-postgresql-app$' /tmp/cnpg.yaml

  # Single required status check. Passes when every suite either succeeded or
  # was skipped (area untouched); fails if any suite failed or was cancelled.
  # Branch protection requires only this job, so path-skipped suites never
  # block a merge.
  ci-gate:
    name: CI Gate
    needs:
      - changes
      - go-tests
      - go-lint
      - frontend-tests
      - frontend-checks
      - helm-lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
