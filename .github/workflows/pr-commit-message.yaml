---
# Guards against release-please silently dropping a PR from the changelog. Its
# strict conventional-commit parser throws on some messages and then skips the
# commit while its own run stays green (#985, upstream
# googleapis/release-please#2564). Squash commits are "<PR title> (#N)" with a
# BLANK body (squash_merge_commit_message=BLANK, #1208), unless the PR
# description has a BEGIN_COMMIT_OVERRIDE block, which release-please reads
# instead. We parse whichever release-please will use, and flag Release-As /
# BREAKING CHANGE lines left outside an override (they would be ignored).
#
# Runs on `edited` too, so editing the PR title/body re-validates (a new commit
# is not required). Kept out of test.yaml to avoid re-running the heavy suites on
# every description tweak.
name: PR Commit Message

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Keyed on the event action too: release-please and Renovate push the branch and
# rewrite the PR description at the same moment, so one synchronize and one edited
# run start together. In a shared group one would cancel the other, leaving a
# cancelled ❌ on the PR (#1362). A newer run still cancels an older one of the
# same action.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  parse:
    name: Parse squash commit message
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release commit message
        env:
          # Pass via env (never inline ${{ }}) to avoid script injection.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        # The runner's preinstalled Node/npm is enough for node:test + one ESM
        # dependency, so no setup-node.
        run: |
          # Pin the exact parser release-please depends on (^0.4.1; latest 0.4.1).
          npm install --no-save --no-audit --no-fund @conventional-commits/parser@0.4.1
          node --test .github/scripts/check-pr-commit-message.test.mjs
          node .github/scripts/check-pr-commit-message.mjs
