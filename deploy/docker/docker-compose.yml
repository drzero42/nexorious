# Simple deployment using the published container image.
#
# Services:
#   db      — PostgreSQL 18 database. POSTGRES_USER (nexorious) is the
#             database's superuser, for administration only.
#   db-role — one-shot step, run before every app start: makes the
#             non-superuser role nexorious_app (password POSTGRES_PASSWORD)
#             the owner of the database. The app connects as that role, so a
#             restored backup can't run programs on the database host.
#   app     — Nexorious binary (embeds frontend; serves the /migrate page until
#             the schema is applied — migrations are not run automatically)
#
# Usage:
#   docker compose up -d        # Start all services
#   docker compose down         # Stop (keeps volumes)
#   docker compose down -v      # Stop and remove volumes (fresh DB)
#
# Configuration: copy .env.example to .env in this directory and fill in values.

services:
  db:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: nexorious
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nexorious
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexorious"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 256m

  db-role:
    image: ghcr.io/drzero42/nexorious:0.99.0 # x-release-please-version
    command: ["ensure-db-role"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexorious_app:${POSTGRES_PASSWORD}@db:5432/nexorious?sslmode=disable
      DB_ADMIN_USER: nexorious
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}

  app:
    image: ghcr.io/drzero42/nexorious:0.99.0 # x-release-please-version
    # Explicit for clarity/robustness; the image CMD already defaults to serve.
    command: ["serve"]
    # The server restarts itself after a backup restore; if that fails it
    # exits and relies on this policy to be started again.
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-role:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nexorious_app:${POSTGRES_PASSWORD}@db:5432/nexorious?sslmode=disable
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY is required}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?IGDB_CLIENT_ID is required}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?IGDB_CLIENT_SECRET is required}
      LEGENDARY_WORK_DIR: /var/lib/legendary
      STORAGE_PATH: /app/storage
      BACKUP_PATH: /app/storage/backups
    volumes:
      - nexorious_storage:/app/storage
      - type: tmpfs
        target: /var/lib/legendary
        tmpfs:
          mode: 0777
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 256m

volumes:
  postgres_data:
  nexorious_storage:
